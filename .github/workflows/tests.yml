name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cycle complet (faux serveur de messagerie)
        run: python tests/test_flow.py
        env:
          PYTHONUTF8: "1"
      - name: Recherche d'adresse (faux site)
        run: python tests/test_contact.py
        env:
          PYTHONUTF8: "1"
